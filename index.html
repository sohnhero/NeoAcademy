<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainAcademy AI - Web3 Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #020617;
            --bg-secondary: rgba(15, 23, 42, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(59, 130, 246, 0.3);
            --accent-primary: #3b82f6;
            --accent-secondary: #60a5fa;
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glow-color: rgba(59, 130, 246, 0.4);
            --mesh-bg: #02040d;
            --mesh-gradient: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 55%),
                radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.08) 0px, transparent 55%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.5) 0px, transparent 100%);
            --grid-color: rgba(255, 255, 255, 0.01);
            --noise-opacity: 0.015;
            --shine-gradient: linear-gradient(110deg, #fff 40%, rgba(59, 130, 246, 0.3) 50%, #fff 60%);
        }

        .light-mode {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --accent-primary: #3b82f6;
            --accent-secondary: #60a5fa;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.05);
            --glow-color: rgba(59, 130, 246, 0.1);
            --mesh-bg: #f8fafc;
            --mesh-gradient: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.02) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(255, 255, 255, 0.95) 0px, transparent 100%);
            --grid-color: rgba(0, 0, 0, 0.02);
            --noise-opacity: 0.01;
            --shine-gradient: linear-gradient(110deg, #0f172a 40%, rgba(59, 130, 246, 0.5) 50%, #0f172a 60%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            overflow-x: hidden;
            letter-spacing: -0.01em;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Outfit', sans-serif;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glow-blue {
            box-shadow: 0 0 30px var(--glow-color);
        }

        .bg-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.1),
                0 2px 4px -1px rgba(0, 0, 0, 0.06),
                inset 0 1px 1px rgba(255, 255, 255, 0.02);
        }

        .bg-glass-light {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid var(--glass-border);
        }

        .light-mode .bg-glass-light {
            background: rgba(0, 0, 0, 0.02);
        }

        .bento-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            position: relative;
        }

        .bento-card:hover {
            background: var(--bg-secondary);
            border-color: var(--border-hover);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .light-mode .bento-card:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        .bento-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(800px circle at var(--mouse-x) var(--mouse-y), rgba(255, 255, 255, 0.06), transparent 40%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .bento-card:hover::after {
            opacity: 1;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            }

            50% {
                box-shadow: 0 0 40px rgba(59, 130, 246, 0.5);
            }

            100% {
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            }
        }

        @keyframes slide-up {
            from {
                transform: translateY(40px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .animate-float-delayed {
            animation: float 8s ease-in-out infinite;
            animation-delay: 2s;
        }

        .animate-pulse-glow {
            animation: pulse-glow 4s ease-in-out infinite;
        }

        .animate-slide-up {
            animation: slide-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
        }

        /* Noise Texture Overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: var(--noise-opacity);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Grid Pattern */
        .grid-pattern {
            background-image: linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Reveal on Scroll */
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .text-gradient {
            background: linear-gradient(to right, var(--text-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-blue-gradient {
            background: linear-gradient(to right, #2563eb, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-shine {
            background: var(--shine-gradient);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to {
                background-position: -200% 0;
            }
        }

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: #3b82f6;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: width 0.1s ease-out;
        }

        .hero-compact {
            min-height: auto !important;
            padding-top: 6rem !important;
            padding-bottom: 2rem !important;
        }

        .bg-blue-glow {
            background: radial-gradient(circle at center, rgba(37, 99, 235, 0.1) 0%, transparent 70%);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        /* Smooth Mesh Gradient Background */
        .mesh-gradient {
            background-color: var(--mesh-bg);
            background-image: var(--mesh-gradient);
            background-attachment: fixed;
            transition: background 0.5s ease;
        }

        .premium-border {
            position: relative;
        }

        .premium-border::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(to bottom right, var(--border-color), transparent, var(--border-color));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>

</head>

<body class="mesh-gradient">
    <div class="noise-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        // Mouse tracking for bento cards
        document.addEventListener('mousemove', e => {
            for (const card of document.getElementsByClassName('bento-card')) {
                const rect = card.getBoundingClientRect(),
                    x = e.clientX - rect.left,
                    y = e.clientY - rect.top;

                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            }
        });

        // Reveal on scroll
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, observerOptions);

        window.addEventListener('load', () => {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(el => observer.observe(el));
        });

        // Re-observe if content changes (SPA navigation)
        const mutationObserver = new MutationObserver(() => {
            const reveals = document.querySelectorAll('.reveal:not(.active)');
            reveals.forEach(el => observer.observe(el));
        });
        mutationObserver.observe(document.body, { childList: true, subtree: true });

        // Scroll Progress
        window.addEventListener('scroll', () => {
            const h = document.documentElement,
                b = document.body,
                st = 'scrollTop',
                sh = 'scrollHeight';
            const percent = (h[st] || b[st]) / ((h[sh] || b[sh]) - h.clientHeight) * 100;
            const progress = document.querySelector('.scroll-progress');
            if (progress) progress.style.width = percent + '%';
        });
    </script>
</body>

</html>
